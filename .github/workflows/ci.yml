name: 推理接口CPU检查
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      LAYERNORM_TYPE: torch
      PROTENIX_DISABLE_FUSED_LN: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - run: oridynamic --help && oridynamic sample --help
      - run: python -B -m unittest discover -s tests -v
      - run: python -B tools/release_bundle.py check
      - run: python -m pip install "setuptools>=77" wheel
      - run: python -B tests/check_installed_package.py
