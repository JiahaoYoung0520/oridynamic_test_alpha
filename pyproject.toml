[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oridynamic-inference"
version = "0.1.0a0"
description = "All-atom biomolecular ensemble generation with OriDynamic"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-PTX", "NOTICE", "THIRD_PARTY_NOTICES"]
requires-python = ">=3.11,<3.12"
dynamic = ["dependencies"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Private :: Do Not Upload",
]

[project.scripts]
oridynamic = "oridynamic.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-inference.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["oridynamic*", "protenix*", "configs", "runner"]
exclude = ["tests*", "tools*", "runs*", "inputs*", "weights*", "assets*"]

[tool.setuptools.package-data]
configs = ["inference_defaults.json", "base_diffusion_signature.json", "portable_paths.example.json", "container_paths.example.json"]
